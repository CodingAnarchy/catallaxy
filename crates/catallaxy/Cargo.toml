[package]
name = "catallaxy"
description = "The Catallaxy programming language: a statically typed, Ruby-flavored language whose threads run truly in parallel"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "catx"
path = "src/main.rs"

[dependencies]
catallaxy-gc.workspace = true
catallaxy-runtime.workspace = true
catallaxy-vm.workspace = true
catallaxy-compiler.workspace = true
catallaxy-stdlib.workspace = true
rustc-hash.workspace = true
lsp-server = "0.7"
lsp-types = "0.97"
rustyline = "18"
serde_json = "1"
serde = "1"

[features]
# Document formatting in the language server; requires `catallaxy_compiler::fmt::format_source`.
default = ["fmt"]
fmt = []
# Print executed-opcode and opcode-pair counts after `catx run` (slows the interpreter).
op-profile = ["catallaxy-vm/op-profile"]

[dev-dependencies]
serde_json = "1"

[target."cfg(unix)".dependencies]
libc = "0.2"
