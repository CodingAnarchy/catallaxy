[package]
name = "catallaxy-capi"
description = "C ABI for embedding and extending the Catallaxy language"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true
include = ["src/**", "include/**", "examples/**", "Cargo.toml"]

[lib]
crate-type = ["rlib", "staticlib", "cdylib"]

[dependencies]
catallaxy.workspace = true
catallaxy-runtime.workspace = true
catallaxy-stdlib.workspace = true
catallaxy-vm.workspace = true
catallaxy-gc.workspace = true

[features]
# Makes `catallaxy_gc::Allocator` the global allocator of the C libraries (see the crate docs).
# A Rust program that depends on this crate and brings its own allocator turns it off.
default = ["global-allocator"]
global-allocator = []
