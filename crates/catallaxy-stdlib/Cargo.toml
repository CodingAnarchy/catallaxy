[package]
name = "catallaxy-stdlib"
description = "Native standard library for the Catallaxy language"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
keywords.workspace = true
categories.workspace = true
readme.workspace = true

[dependencies]
catallaxy-gc.workspace = true
catallaxy-runtime.workspace = true
catallaxy-vm.workspace = true
crossbeam-deque.workspace = true
num-bigint.workspace = true
num-traits.workspace = true
num-integer.workspace = true
parking_lot.workspace = true
rustc-hash.workspace = true
serde_json = "1"
libc = "0.2"
regex = "1"
corosensei = "0.3"
mio = { version = "1", features = ["os-poll", "net"] }
ureq = "3"
# Both already in the tree through ureq (rustls), so digests and base64 add no new crates.
ring = "0.17"
base64 = "0.23"

[lints.rust]
# `catx_tsan`: ThreadSanitizer fiber annotations (src/fiber.rs, the `tsan-suite` CI job).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(catx_tsan)"] }
