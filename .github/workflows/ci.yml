name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Unit tests
        run: cargo test --release --locked
      - name: Collector soak (parallel mutators, 50 runs)
        run: for i in $(seq 1 50); do cargo test --release --locked -q -p catallaxy-gc --test gc || exit 1; done
      - name: Conformance suite
        run: ./target/release/catx test tests/conformance
      - name: Conformance suite under GC stress
        run: CATX_GC_STRESS=1 ./target/release/catx test tests/conformance/run
      - name: Examples
        run: ./target/release/catx test examples
      - name: C ABI example
        run: |
          cargo build --release --locked -p catallaxy-capi
          LIBS=""; if [ "$RUNNER_OS" = "Linux" ]; then LIBS="-lpthread -ldl -lm"; fi
          cc -Wall -Wextra -Werror -I crates/catallaxy-capi/include crates/catallaxy-capi/examples/ext.c target/release/libcatallaxy_capi.a $LIBS -o ext
          ./ext 2>/dev/null | diff - crates/catallaxy-capi/examples/ext.out
          CATX_GC_STRESS=1 ./ext 2>/dev/null | diff - crates/catallaxy-capi/examples/ext.out
      - name: Clippy
        run: cargo clippy --release --locked -- -D warnings

  miri:
    # parking_lot_core's Linux futex call is rejected by current Miri; macOS is fine.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - name: Miri (gc and runtime, Tree Borrows)
        env:
          MIRIFLAGS: -Zmiri-disable-isolation -Zmiri-permissive-provenance -Zmiri-tree-borrows -Zmiri-ignore-leaks
        run: cargo miri test -p catallaxy-gc -p catallaxy-runtime

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: ThreadSanitizer (gc and runtime)
        env:
          RUSTFLAGS: -Zsanitizer=thread
          TSAN_OPTIONS: suppressions=${{ github.workspace }}/tsan.supp
        run: cargo test -p catallaxy-gc -p catallaxy-runtime --lib --tests --target x86_64-unknown-linux-gnu -Zbuild-std
      - name: Loom (object lock and mark protocol)
        env:
          RUSTFLAGS: --cfg loom
        run: cargo test -p catallaxy-gc --test loom --release

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
      - run: cargo install cargo-fuzz --locked
      - name: Fuzz the compiler front end (2 minutes)
        run: |
          mkdir -p fuzz/corpus/check
          cp tests/conformance/run/*.cx tests/conformance/reject/*.cx examples/*.cx fuzz/corpus/check/
          cd fuzz && cargo fuzz run check -- -max_total_time=120 -max_len=4096 -timeout=10
