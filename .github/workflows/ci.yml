name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --release --locked
      - name: Unit tests
        run: cargo test --release --locked
      - name: Conformance suite
        run: ./target/release/catx test tests/conformance
      - name: Conformance suite under GC stress
        run: CATX_GC_STRESS=1 ./target/release/catx test tests/conformance/run
      - name: Examples
        run: ./target/release/catx test examples
      - name: Clippy
        run: cargo clippy --release --locked -- -D warnings

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - name: Miri (gc and runtime)
        run: cargo miri test -p catallaxy-gc -p catallaxy-runtime --lib
      - name: ThreadSanitizer (gc)
        run: RUSTFLAGS="-Zsanitizer=thread" cargo test -p catallaxy-gc --target x86_64-unknown-linux-gnu -Zbuild-std
