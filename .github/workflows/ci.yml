name: CI

on:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  oom-stress:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo test --release --locked -p catallaxy --test out_of_memory --no-run
      - name: Out-of-memory tests, repeated
        run: |
          for i in $(seq 1 12); do
            echo "=== run $i"
            cargo test --release --locked -p catallaxy --test out_of_memory -- --test-threads=1 --nocapture 2>&1 | grep -E "OUTCOME|test result|FAILED|panicked" ; test ${PIPESTATUS[0]} -eq 0 || exit 1
          done
