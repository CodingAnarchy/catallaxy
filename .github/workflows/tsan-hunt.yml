name: tsan hunt
on: pull_request
jobs:
  hunt:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6]
    env:
      RUSTFLAGS: -Zsanitizer=thread --cfg catx_tsan
      CARGO_PROFILE_RELEASE_LTO: "off"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "16"
      TSAN_OPTIONS: suppressions=${{ github.workspace }}/tsan.supp
      CATX: target/x86_64-unknown-linux-gnu/release/catx
      CATX_TEST_TIMEOUT: "60"
      CATX_TEST_GDB: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - uses: Swatinem/rust-cache@v2
        with:
          key: tsan
      - run: sudo sysctl vm.mmap_rnd_bits=28
      - run: sudo sysctl kernel.yama.ptrace_scope=0 || true
      - run: sudo apt-get install -yq gdb
      - run: >-
          cargo build --release --locked -p catallaxy --bin catx --target x86_64-unknown-linux-gnu
          -Zbuild-std -Zprofile-rustflags
          --config 'profile.release.package.catallaxy-stdlib.rustflags=["-Cllvm-args=-tsan-instrument-func-entry-exit=0"]'
          --config 'profile.release.package.corosensei.rustflags=["-Cllvm-args=-tsan-instrument-func-entry-exit=0"]'
      - name: net_echo x30 with trace
        run: |
          for i in $(seq 1 60); do
            if ! env $([ ${{ matrix.shard }} -gt 3 ] && echo CATX_NET_TRACE=1) timeout 60 $CATX run tests/conformance/run/net_echo.cx > out.txt 2> trace.txt; then
              echo "HANG on iteration $i"; cat out.txt; echo "trace lines: $(wc -l < trace.txt)"
              cp trace.txt hung-trace.txt
              exit 1
            fi
          done
          echo "no hang in 30 runs"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: trace-${{ matrix.shard }}
          path: hung-trace.txt
