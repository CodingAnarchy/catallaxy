name: Release
# Publishes every crate on a version tag, in dependency order, then creates a GitHub release.
# Needs a CARGO_REGISTRY_TOKEN repository secret (a crates.io API token with publish scope).
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches the workspace version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          crates="catallaxy-gc catallaxy-runtime catallaxy-vm catallaxy-compiler catallaxy-stdlib catallaxy catallaxy-capi"
          # Skip versions already on crates.io (published by hand, or by an earlier partial run).
          # Ask the API for the exact version: `cargo search` lags behind fresh uploads.
          todo=""
          for c in $crates; do
            if curl -sf -o /dev/null -A "catallaxy-release (https://github.com/CodingAnarchy/catallaxy)" \
                "https://crates.io/api/v1/crates/$c/${GITHUB_REF_NAME#v}"; then
              echo "$c ${GITHUB_REF_NAME#v} already published"
            else
              todo="$todo $c"
            fi
          done
          if [ -n "$todo" ] && [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::error::CARGO_REGISTRY_TOKEN is not set, but these crates still need publishing:$todo"
            echo "Add a crates.io API token with publish scope as the CARGO_REGISTRY_TOKEN repository secret, then re-run this job."
            exit 1
          fi
          for c in $todo; do
            cargo publish --locked -p "$c"
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Safe to re-run: leave an existing release alone.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "release $GITHUB_REF_NAME already exists"
          else
            gh release create "$GITHUB_REF_NAME" --generate-notes --title "Catallaxy ${GITHUB_REF_NAME#v}"
          fi
