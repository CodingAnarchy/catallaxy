name: Release
# Publishes every crate on a version tag, in dependency order, then creates a GitHub release.
# Needs a CARGO_REGISTRY_TOKEN repository secret (a crates.io API token with publish scope).
on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Check the tag matches the workspace version
        run: |
          version=$(grep -m1 '^version' Cargo.toml | cut -d'"' -f2)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - name: Publish crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: |
          for c in catallaxy-gc catallaxy-runtime catallaxy-vm catallaxy-compiler catallaxy-stdlib catallaxy catallaxy-capi; do
            # Skip versions already on crates.io so a re-run after a partial failure resumes.
            if cargo search "$c" --limit 1 | grep -q "^$c = \"${GITHUB_REF_NAME#v}\""; then
              echo "$c ${GITHUB_REF_NAME#v} already published"; continue
            fi
            cargo publish --locked -p "$c"
          done
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --title "Catallaxy ${GITHUB_REF_NAME#v}"
